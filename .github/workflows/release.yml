name: Build and Release

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - GOOS: linux
            GOARCH: amd64
            name: linux-amd64
          - GOOS: linux
            GOARCH: arm64
            name: linux-arm64
          - GOOS: linux
            GOARCH: arm
            GOARM: 7
            name: linux-armv7

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build with Make
        run: |
          make clean
          make tidy
          make build-cross
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
          GOARM: ${{ matrix.GOARM }}
          NAME: ${{ matrix.name }}

      - name: Create or Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/quickflare-go-*
          tag_name: latest
          name: "Latest Build"
          body: "Automatischer Build bei jedem Push."
          make_latest: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
